spring:
  application:
    name: bicycle-rental-system
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bicycle_rental}
    username: ${DB_USERNAME:bike}
    password: ${DB_PASSWORD:bike}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

viacep:
  base-url: https://viacep.com.br/ws

security:
  jwt:
    # HS256 needs at least 32 bytes. Always override JWT_SECRET outside local development.
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-abcdefghij}
    expiration: 1h
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
